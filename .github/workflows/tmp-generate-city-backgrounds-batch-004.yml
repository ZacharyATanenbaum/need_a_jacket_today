name: Temporary Generate City Backgrounds Batch 004

on:
  push:
    branches:
      - tmp-generate-city-backgrounds-batch-004-20260713
    paths:
      - tools/generate_city_backgrounds_batch4.py
      - .github/workflows/tmp-generate-city-backgrounds-batch-004.yml

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image dependencies
        run: python -m pip install --disable-pip-version-check pillow numpy requests opencv-python-headless

      - name: Generate backgrounds and ZIP
        run: python tools/generate_city_backgrounds_batch4.py

      - name: Upload generated ZIP
        uses: actions/upload-artifact@v4
        with:
          name: world-city-backgrounds-batch-004
          path: generated/world-city-backgrounds-batch-004.zip
          if-no-files-found: error
          compression-level: 0

      - name: Upload validation contact sheet
        uses: actions/upload-artifact@v4
        with:
          name: world-city-backgrounds-batch-004-preview
          path: generated/world-city-backgrounds-batch-004/validation-contact-sheet.jpg
          if-no-files-found: error
          compression-level: 0
