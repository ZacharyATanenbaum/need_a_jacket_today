<!doctype html>
<html lang="en" class="h-full bg-slate-950 text-slate-100">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Need a Jacket?</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      :root { --fg:#0ea5e9; --fg2:#22c55e; --ink:#0b1220 }
      @keyframes float { 0%{transform:translateY(0)} 50%{transform:translateY(-6px)} 100%{transform:translateY(0)} }
      .animate-float { animation: float 3s ease-in-out infinite }
      .no-scrollbar::-webkit-scrollbar { display: none }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none }
    </style>
  </head>
  <body class="h-full">
    <!-- Header (fixed height to prevent expansion) -->
    <header class="h-16 px-4 border-b border-slate-800/60">
      <div class="relative h-full flex items-center gap-3">
        <h1 class="text-lg font-semibold tracking-tight">
          <span class="sm:hidden">NaJ?</span>
          <span class="hidden sm:inline">Need a Jacket?</span>
        </h1>

        <!-- Right side: either default controls or inline search (same row). Search overlays, so bar height never changes. -->
        <div class="ml-auto flex items-center gap-2">
          <!-- Default nav content -->
          <div id="nav-default" class="flex items-center gap-2">
            <!-- Unit toggle -->
            <div class="flex items-center h-9 rounded-full bg-slate-800 text-xs overflow-hidden">
              <button id="unit-f" class="h-full px-3 flex items-center justify-center bg-slate-100 text-slate-900">°F</button>
              <button id="unit-c" class="h-full px-3 flex items-center justify-center text-slate-200">°C</button>
            </div>
            <button id="use-location" class="rounded-full px-4 h-9 flex items-center bg-slate-800 hover:bg-slate-700 text-xs sm:text-sm whitespace-nowrap">
              <span data-label="compact" class="sm:hidden">Use location</span>
              <span data-label="full" class="hidden sm:inline">Use my location</span>
            </button>
            <button id="open-search" class="rounded-full h-9 w-9 grid place-items-center bg-slate-800 hover:bg-slate-700" aria-label="Search location">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-5 h-5"><path d="M10 2a8 8 0 1 1 0 16 8 8 0 0 1 0-16m13 19.59-5.74-5.74a10 10 0 1 0-1.41 1.41L21.59 23 23 21.59Z"/></svg>
            </button>
          </div>

          <!-- Inline search mode (overlay within nav; absolute so it doesn't affect layout/height) -->
          <div id="nav-search" class="hidden absolute right-4 top-1/2 -translate-y-1/2 w-full max-w-[520px]">
            <div class="flex items-center gap-2">
              <div class="flex-1 flex items-center gap-2 rounded-xl bg-slate-900 border border-slate-800 px-3 py-2">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-4 h-4 text-slate-400"><path d="M10 2a8 8 0 1 1 0 16 8 8 0 0 1 0-16m13 19.59-5.74-5.74a10 10 0 1 0-1.41 1.41L21.59 23 23 21.59Z"/></svg>
                <input id="search-input" class="flex-1 bg-transparent outline-none placeholder:text-slate-500" placeholder="City or place" />
              </div>
              <button id="search-submit" class="rounded-lg px-3 py-2 bg-slate-100 text-slate-900">Go</button>
              <button id="close-search" class="rounded-lg px-3 py-2 bg-slate-800 hover:bg-slate-700">Cancel</button>
            </div>
          </div>
        </div>
      </div>
    </header>

    <!-- Main card -->
    <main class="p-4">
      <div class="mx-auto max-w-xl rounded-3xl border border-slate-800 bg-slate-900/60 p-6">
        <!-- Centered location + updated line over avatar -->
        <div class="w-full flex items-center justify-center gap-2 text-sm text-slate-300 mb-3">
          <div id="location-line" class="truncate">—</div>
          <span aria-hidden>•</span>
          <div id="updated-at" class="shrink-0">Updated —</div>
          <button id="refresh" class="ml-1 rounded-full p-1.5 bg-slate-800 hover:bg-slate-700" title="Refresh">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-4 h-4"><path d="M12 6v3l4-4-4-4v3a8 8 0 1 0 8 8h-2a6 6 0 1 1-6-6Z"/></svg>
          </button>
        </div>

        <!-- Avatar -->
        <div class="w-full grid place-items-center">
          <div class="w-56 md:w-72 aspect-[240/260] rounded-[32px] border border-slate-800/80 bg-slate-800/40 backdrop-blur-sm grid place-items-center overflow-hidden drop-shadow-xl animate-float">
            <img id="avatar-image" src="images/webp/0__stay_at_home-512.webp" alt="Outfit recommendation" class="w-full h-full object-cover" />
          </div>
        </div>

        <!-- Verdict -->
        <div class="mt-5 text-center">
          <h2 class="text-2xl md:text-3xl font-semibold"><span class="text-slate-300">Wear:</span> <span id="wear-label">—</span></h2>
          <p id="umbrella-line" class="mt-1 text-slate-300">Umbrella —</p>
        </div>

        <!-- Next 24 hours -->
        <section class="mt-6">
          <div class="flex items-center justify-between mb-2">
            <div class="text-sm font-medium">Next 24 hours</div>
            <div class="flex items-center gap-3">
              <div id="hourly-summary" class="text-xs text-slate-400">—</div>
            </div>
          </div>
          <div id="hourly-24" class="flex gap-2 overflow-x-auto no-scrollbar py-2"></div>
          <div class="mt-2 text-[11px] text-slate-500">Scroll to see all hours</div>
        </section>

        <!-- Comfort preference controls -->
        <section class="mt-6">
          <div class="text-center">
            <div class="text-xs uppercase tracking-wide text-slate-500 mb-2">Comfort Profile</div>
            <div class="flex justify-center">
              <div class="inline-flex items-center rounded-full bg-slate-800/80 border border-slate-800 overflow-hidden">
                <button id="profile-hot" class="px-3 py-2 flex items-center justify-center whitespace-nowrap text-xs sm:text-sm text-slate-200">Always Hot</button>
                <button id="profile-regular" class="px-3 py-2 flex items-center justify-center whitespace-nowrap text-xs sm:text-sm bg-slate-100 text-slate-900">Regular</button>
                <button id="profile-cold" class="px-3 py-2 flex items-center justify-center whitespace-nowrap text-xs sm:text-sm text-slate-200">Always Cold</button>
              </div>
            </div>
          </div>
        </section>
      </div>
    </main>

    <script src="app.js" type="module"></script>
  </body>
</html>
