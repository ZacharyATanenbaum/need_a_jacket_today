<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Need A Jacket Today?</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="container">
    <header>
      <h1>Need A Jacket Today?</h1>
      <p class="tagline">Weather-based outfit guidance for the next few hours.</p>
    </header>

    <section class="panel location-controls" aria-labelledby="location-heading">
      <h2 id="location-heading">Choose Location</h2>
      <form id="search-form" class="search-form" autocomplete="off">
        <label for="location-input">City, postal code, or coordinates</label>
        <div class="search-row">
          <input id="location-input" name="location" type="text" placeholder="New York" spellcheck="false">
          <button type="submit">Search</button>
        </div>
      </form>
      <button type="button" id="use-current" class="secondary">Use My Location</button>
      <p class="current-location">Currently showing: <span id="location-name">New York, NY</span></p>
    </section>

    <section id="status" class="panel status">Loading forecast for New York City…</section>

    <section id="summary" class="panel hidden" aria-live="polite">
      <div class="recommendations">
        <article class="summary-card">
          <h2>Your Layer</h2>
          <p id="layer" class="callout"></p>
          <p id="layer-detail" class="detail"></p>
        </article>
        <article class="summary-card">
          <h2>Umbrella</h2>
          <p id="umbrella" class="callout"></p>
          <p id="umbrella-detail" class="detail"></p>
        </article>
      </div>
    </section>

    <section id="hourly" class="panel hidden">
      <h2>Next 24 Hours</h2>
      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th scope="col">Time</th>
              <th scope="col">Temp</th>
              <th scope="col">Feels Like</th>
              <th scope="col">Precip Chance</th>
            </tr>
          </thead>
          <tbody id="hourly-rows"></tbody>
        </table>
      </div>
    </section>

    <section id="error" class="panel hidden" role="alert"></section>
  </main>

  <footer>
    <p>Forecast data from <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a>. Built for GitHub Pages.</p>
  </footer>

  <script src="app.js" type="module"></script>
</body>
</html>
